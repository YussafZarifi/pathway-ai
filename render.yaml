# Render Blueprint for PathwayAI: FastAPI backend + static React frontend.
# Apply from the Render Dashboard (New > Blueprint). Render asks for every
# `sync: false` value on first apply. See docs/deployment.md.
services:
  # Backend: FastAPI AI proxy (Gemini + YouTube) + saved roadmaps (Supabase Postgres).
  - type: web
    name: pathwayai-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Keep Uvicorn from interpreting caller-controlled forwarded headers.
    # The app trusts Render's Cloudflare-overwritten CF-Connecting-IP instead.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # The static site's URL, e.g. https://pathwayai-web.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional accounts (ADR-018): https://<project-ref>.supabase.co, used
      # to verify access tokens via the project's public JWKS. Not a secret.
      - key: SUPABASE_URL
        sync: false
      # Optional saved roadmaps (ADR-019). SECRET: Supabase transaction-pooler
      # URL for the least-privilege pathwayai_api role, e.g.
      # postgresql://pathwayai_api.<ref>:<password>@<pooler-host>:6543/postgres?sslmode=require
      # Unset -> /api/roadmaps* return 503; guests are unaffected.
      - key: DATABASE_URL
        sync: false
      # Résumé analysis (ADR-020): "true" only with a Gemini key on a paid
      # project (the unpaid tier's terms forbid personal information).
      - key: RESUME_ANALYSIS_ENABLED
        value: "false"
      # Grounded RAG coaching runs after deterministic resume analysis.
      - key: RAG_RETRIEVER
        value: "langchain"
      - key: RAG_COACHING_ENABLED
        value: "true"
      # Drop clearly broken AI resource links (link_check.py; SSRF-safe).
      - key: LINK_CHECK_ENABLED
        value: "true"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: TRUSTED_PROXY_MODE
        value: "render"
      # AI Coach (ADR-021): "false" switches it off (saves Gemini quota).
      - key: COACH_ENABLED
        value: "true"

  # Frontend: Vite build served as a static site.
  - type: web
    name: pathwayai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    routes:
      # React Router (BrowserRouter): serve index.html for every app route.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The backend's URL, e.g. https://pathwayai-api.onrender.com
      # Read at build time: redeploy the site after changing it.
      - key: VITE_API_URL
        sync: false
      # Optional accounts (ADR-018): Supabase project URL and publishable
      # key (sb_publishable_..., public by design). Leave unset for a
      # guest-only build. Never the secret / service_role key.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
